defaults:
  default_dataset: parkinson_merder
  auto_discovery: true
  strip_numeric_prefix: true
  original_root: "dataset/original"
  split_root: "dataset/split"
  class_mode: "direct"
  seed: 42
  valid_extensions: [".png", ".jpg", ".jpeg", ".bmp", ".tif", ".tiff", ".webp"]
  split:
    train: 0.80
    testing: 0.10
    validation: 0.10
  resize:
    train: [224, 224]
    testing: null
    validation: null
  augmentation_options:
    - no_augment
    - augment_on_the_fly

datasets:
  parkinson_merder:
    description: "Dataset Merder (2 kelas: Healthy vs Parkinson)."
    original_dir: "dataset/original/4_dataset_merder"
    split_dir: "dataset/split/parkinson_merder"

  parkinson_mixing:
    description: "Dataset Mixing (multi-kelas dari spiral/zigzag)."
    original_dir: "dataset/original/6_dataset_mixing"
    split_dir: "dataset/split/parkinson_mixing"
