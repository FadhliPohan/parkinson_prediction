default_training:
  image_size: 224
  batch_size: 16
  # REC-01/02/05: epoch & patience dinaikkan, LR fine-tune diperbesar agar
  # konvergensi lebih optimal untuk medical imaging.
  epochs: 25
  fine_tune_epochs: 10
  fine_tune_freeze_ratio: 0.7
  learning_rate: 0.001
  fine_tune_learning_rate: 0.00005
  dropout: 0.35
  optimizer: adam            # T2: adam | no_optimize
  early_stopping_patience: 8
  seed: 42

  max_per_class: null
  max_train_per_class: null
  max_validation_per_class: null
  max_test_per_class: null

  train_batch_limit: null
  validation_batch_limit: null
  test_batch_limit: null

  shuffle_buffer_size: 2048
  num_parallel_calls: 2
  prefetch_buffer: 1

  gpu_memory_limit_mb: null
  max_cpu_usage_percent: 70
  cpu_thread_limit: null

  disable_cpu_fallback: false
  mixed_precision: false
  no_pretrained: false

  yolo_size: "n"
